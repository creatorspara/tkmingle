name: tkmingle
description: "TKMingle — Campus Social Discovery Platform for TKM College of Engineering (TKMCE)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  app_links: 6.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.jpg
    - assets/images/app_icon.png
