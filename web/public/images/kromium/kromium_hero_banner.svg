<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="60%" stop-color="#0B0B14"/>
      <stop offset="100%" stop-color="#120D24"/>
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE"/>
      <stop offset="50%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#4834D4"/>
    </linearGradient>

    <!-- Chevron Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C2A99" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#5B45E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D6BF7"/>
      <stop offset="100%" stop-color="#6351E6"/>
    </linearGradient>

    <!-- Filter for soft ambient glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <style>
    .font-brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  </style>

  <!-- Base Card Rectangle -->
  <rect x="0" y="0" width="1200" height="520" rx="24" fill="url(#cardBg)"/>
  <rect x="0" y="0" width="1200" height="520" rx="24" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>

  <!-- Ambient Purple Glow in lower right -->
  <circle cx="1020" cy="380" r="260" fill="#5843E0" opacity="0.3" filter="url(#ambientGlow)"/>

  <!-- Geometric Chevron Pattern in Background (Right Side) -->
  <g transform="translate(620, -60)" opacity="0.85">
    <!-- Chevron 1 (Deeper layer) -->
    <path d="M260,200 L420,360 L360,420 L200,260 Z" fill="url(#glowGrad)" opacity="0.4"/>
    <path d="M200,260 L360,420 L300,480 L140,320 Z" fill="url(#glowGrad)" opacity="0.5"/>

    <!-- Chevron 2 (Mid layer) -->
    <path d="M360,100 L540,280 L470,350 L290,170 Z" fill="url(#glowGrad)" opacity="0.55"/>
    
    <!-- Bold Sharp Chevrons -->
    <path d="M380,260 L500,380 L440,440 L320,320 Z" fill="url(#purpleGrad)" opacity="0.8"/>
    <path d="M470,170 L610,310 L550,370 L410,230 Z" fill="url(#purpleGrad)" opacity="0.9"/>
    <path d="M560,80 L720,240 L660,300 L500,140 Z" fill="url(#purpleGrad)" opacity="0.75"/>
  </g>

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <!-- Logo Symbol (Geometric K) -->
  <g transform="translate(64, 48)">
    <g transform="scale(0.85)">
      <!-- Left diagonal ribbon -->
      <path d="M38.8,3.2 L8.6,33.4 C5.4,36.6 5.4,41.8 8.6,45.0 L29.2,65.6 C31.8,68.2 36.0,68.2 38.6,65.6 L59.4,44.8 C62.0,42.2 62.0,38.0 59.4,35.4 L38.8,14.8 L47.4,6.2 C49.6,4.0 47.8,0.2 44.6,0.2 L41.2,0.2 C40.3,0.2 39.4,0.6 38.8,1.2 Z" fill="#6C5CE7"/>
      <!-- Upper right wing -->
      <path d="M42.0,16.0 L62.6,36.6 C65.2,39.2 65.2,43.4 62.6,46.0 L52.0,56.6 C49.4,59.2 45.2,59.2 42.6,56.6 L22.0,36.0 C19.4,33.4 19.4,29.2 22.0,26.6 L32.6,16.0 C35.2,13.4 39.4,13.4 42.0,16.0 Z" fill="#6C5CE7" opacity="0.95"/>
      <!-- Lower right chevron wing -->
      <path d="M42.0,42.0 L66.0,66.0 C68.6,68.6 68.6,72.8 66.0,75.4 L56.0,85.4 C53.4,88.0 49.2,88.0 46.6,85.4 L22.6,61.4 C20.0,58.8 20.0,54.6 22.6,52.0 L32.6,42.0 C35.2,39.4 39.4,39.4 42.0,42.0 Z" fill="#6C5CE7"/>
    </g>

    <!-- Wordmark -->
    <text x="68" y="27" fill="#FFFFFF" class="font-brand" font-size="20" font-weight="700" letter-spacing="-0.01em">Equipo</text>
    <text x="68" y="52" fill="#FFFFFF" class="font-brand" font-size="20" font-weight="700" letter-spacing="-0.01em">Kromium</text>
  </g>

  <!-- Navigation Links -->
  <g transform="translate(600, 72)" class="font-brand" font-size="16" font-weight="500">
    <text x="0" y="0" fill="#B4B4C8">Projects</text>
    <text x="96" y="0" fill="#B4B4C8">Team</text>
    <text x="176" y="0" fill="#B4B4C8">Contribute</text>

    <!-- Join Us Button -->
    <rect x="300" y="-28" width="108" height="42" rx="21" fill="url(#btnGrad)"/>
    <text x="354" y="-1" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Join Us</text>
  </g>

  <!-- ================= HERO CONTENT ================= -->
  <!-- Main Headline -->
  <g transform="translate(64, 230)" class="font-brand">
    <text x="0" y="0" fill="#FFFFFF" font-size="64" font-weight="800" letter-spacing="-0.03em">
      Build<tspan fill="#6C5CE7">.</tspan> Open<tspan fill="#6C5CE7">.</tspan> Share<tspan fill="#6C5CE7">.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="52" fill="#9E9EB6" font-size="21" font-weight="400" letter-spacing="-0.01em">
      A student led developer team creating open source software for the community.
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="224" height="52" rx="14" fill="url(#btnGrad)"/>
      <text x="112" y="32" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Explore Our Projects  &rarr;</text>
    </g>
  </g>
</svg>
