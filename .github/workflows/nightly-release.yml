name: TKMingle Nightly Release Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-nightly:
    name: Build & Publish Nightly APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret! Aborting release."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret! Aborting release."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing ANDROID_KEY_ALIAS secret! Aborting release."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing ANDROID_KEY_PASSWORD secret! Aborting release."
            exit 1
          fi
          echo "All release signing secrets verified successfully."

      - name: Decode Release Keystore & Create key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 -c "import base64, os; open('mobile/android/app/release.keystore', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"
          cat <<EOF > mobile/android/key.properties
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=app/release.keystore
          EOF
          echo "Persistent release keystore and key.properties created."

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code (flutter analyze)
        working-directory: mobile
        run: flutter analyze

      - name: Run unit & widget tests
        working-directory: mobile
        run: flutter test

      - name: Build universal release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Validate APK Signature & Package ID
        run: |
          APK_PATH="mobile/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi
          
          # Find apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"
          
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$APK_PATH"
          echo "APK signature verified successfully."
          
          # Verify package ID
          $BUILD_TOOLS_DIR/aapt dump badging "$APK_PATH" | grep "package: name='com.tkmingle.app'" || (echo "::error::Package ID mismatch! Expected com.tkmingle.app" && exit 1)
          echo "Package ID com.tkmingle.app verified successfully."

      - name: Prepare Nightly Assets
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk TKMingle-nightly.apk
          sha256sum TKMingle-nightly.apk > TKMingle-nightly.apk.sha256
          echo "SHA256 Checksum:"
          cat TKMingle-nightly.apk.sha256

      - name: Publish / Update GitHub Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "TKMingle Nightly Build"
          draft: false
          prerelease: true
          make_latest: "false"
          files: |
            TKMingle-nightly.apk
            TKMingle-nightly.apk.sha256
          body: |
            ## TKMingle Nightly Build (Automated CI/CD)

            > [!WARNING]
            > **BETA / DEVELOPMENT BUILD**: This build is generated automatically from the `master` branch for testing purposes. It is NOT an official stable production release.

            ### Build Metadata
            - **Commit SHA**: `${{ github.sha }}`
            - **Branch**: `master`
            - **Application ID**: `com.tkmingle.app`
            - **Target Platform**: Universal Android APK (`arm64-v8a`, `armeabi-v7a`, `x86`, `x86_64`)
            - **Signing**: Signed with official persistent release keystore (v1 + v2 scheme)

            ### Included In This Build
            - Critical fix: User email integrity preserved (exact user-entered email sent to Supabase Auth).
            - Disallowed domain replacement / prefix generation.
            - Canonical auth redirect anchored to `https://tkmingle.vercel.app`.
            - Verified universal signed release APK distribution.

            ### Verification
            Verify the checksum of your downloaded APK using:
            ```bash
            sha256sum -c TKMingle-nightly.apk.sha256
            ```
