name: TKMingle CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  mobile-ci:
    name: Flutter Android CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code (flutter analyze)
        working-directory: mobile
        run: flutter analyze

      - name: Run unit & widget tests
        working-directory: mobile
        run: flutter test

      - name: Build universal release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tkmingle-universal-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web-ci:
    name: Next.js Web Portal CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Next.js application
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mwwjuibehscukzueykjc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_04veCw-az3gqv23ZD_tUbA_8MKS_lzS"
        run: npm run build
