# Supabase CLI Local Configuration for TKMingle
project_id = "tkmingle"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://tkmingle.vercel.app"
additional_redirect_urls = [
  "https://tkmingle.vercel.app/**",
  "https://tkmingle-creatorspara.vercel.app/**",
  "http://localhost:3000/**"
]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
